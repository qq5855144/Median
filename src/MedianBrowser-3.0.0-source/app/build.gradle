plugins {
    id 'com.android.application'
}


// ---- 动态版本号：基于 git commit 数递增，每次构建可区分且可覆盖安装 ----
def gitCommitCount = { ->
    try {
        def p = 'git rev-list --count HEAD'.execute(null, rootProject.projectDir)
        p.waitFor()
        def out = p.text.trim()
        return out ? out.toInteger() : 0
    } catch (Exception e) {
        return 0
    }
}
final int medianVersionCode = 100 + gitCommitCount()
final String medianVersionName = "3.0.${gitCommitCount()}"

android {
    namespace 'com.xinyv.median'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xinyv.median.compat'
        minSdk 26
        targetSdk 36
        versionCode medianVersionCode
        versionName medianVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = false
    }

    signingConfigs {
        release {
            def storeFileValue = System.getenv('MEDIAN_KEYSTORE')
            def storePasswordValue = System.getenv('MEDIAN_STOREPASS')
            def keyAliasValue = System.getenv('MEDIAN_KEY_ALIAS')
            def keyPasswordValue = System.getenv('MEDIAN_KEYPASS') ?: storePasswordValue
            def repoStore = rootProject.file('keystore/median-release.keystore')
            if (storeFileValue && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFileValue)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            } else if (repoStore.exists()) {
                // 仓库内置开发签名（固定密钥，保证 CI/本地构建可覆盖安装）
                storeFile repoStore
                storePassword 'median@2026'
                keyAlias 'median'
                keyPassword 'median@2026'
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            debuggable true
            if (signingConfigs.release.storeFile != null) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        checkDependencies true
        sarifReport true
        xmlReport true
        htmlReport true
        disable 'OldTargetApi'
        // Zero-dependency build cannot use androidx OnBackPressedDispatcher;
        // predictive back is enabled via manifest enableOnBackInvokedCallback,
        // onBackPressed() remains for legacy back button/gesture on older APIs.
        disable 'GestureBackNavigation'
    }

    testOptions {
        animationsDisabled true
        unitTests.returnDefaultValues = true
    }

    packaging {
        resources.excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
        ]
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
