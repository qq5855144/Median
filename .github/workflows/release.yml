name: Signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/MedianBrowser-3.0.0-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Ensure Android SDK 36 (platform + build-tools)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi

      - name: Verify tag and app version
        run: ./tools/verify_release_tag.sh "${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MEDIAN_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/median-release.p12"
          chmod 600 "$RUNNER_TEMP/median-release.p12"

      - name: Build signed APK and AAB
        env:
          MEDIAN_KEYSTORE: ${{ runner.temp }}/median-release.p12
          MEDIAN_STOREPASS: ${{ secrets.MEDIAN_STOREPASS }}
          MEDIAN_KEY_ALIAS: ${{ secrets.MEDIAN_KEY_ALIAS }}
          MEDIAN_KEYPASS: ${{ secrets.MEDIAN_KEYPASS }}
        run: ./build.sh --release

      - name: Package release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/MedianBrowser-${GITHUB_REF_NAME}.apk
          cp app/build/outputs/bundle/release/app-release.aab release/MedianBrowser-${GITHUB_REF_NAME}.aab
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt release/MedianBrowser-${GITHUB_REF_NAME}-mapping.txt
          fi
          sha256sum release/* | tee release/SHA256SUMS.txt
          ls -lh release/

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}" release/* --verify-tag --generate-notes --title "Median Browser ${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"