name: Android CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: src/MedianBrowser-3.0.0-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install ripgrep (required by static_checks.sh)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Ensure Android SDK 36 (platform + build-tools)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null | head -10 || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            for cand in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              [ -x "$cand" ] && SDKMANAGER="$cand" && break
            done
          fi
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
            echo "SDK36 ready: $(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ')"
          else
            echo "sdkmanager not found under $ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 3 -name sdkmanager 2>/dev/null || true
          fi

      - name: Static security & sanity checks
        run: ./tools/static_checks.sh

      - name: Lint (report even on failure)
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug || true

      - uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            src/MedianBrowser-3.0.0-source/app/build/reports/
            src/MedianBrowser-3.0.0-source/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/

      - name: Lint, unit tests and build (debug APK + release APK/AAB)
        env:
          MEDIAN_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleRelease bundleRelease

      - name: Collect artifacts & checksums
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/MedianBrowser-3.0.0-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk artifacts/MedianBrowser-3.0.0-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/MedianBrowser-3.0.0-release-unsigned.apk
          fi
          cp app/build/outputs/bundle/release/app-release.aab artifacts/MedianBrowser-3.0.0-release.aab
          cp app/build/reports/lint-results-debug.html artifacts/ 2>/dev/null || true
          (cd artifacts && sha256sum * | tee SHA256SUMS.txt)
          echo '===== APK/AAB sizes ====='
          ls -lh artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: median-${{ github.sha }}-apk
          if-no-files-found: error
          path: |
            src/MedianBrowser-3.0.0-source/artifacts/